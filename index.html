                         inputs: { left: false, right: false, jump: false, attack: false, down: false, isSpectator: true }
                     }));
                 }

                buildSpectatorEntityList();
                document.getElementById('spectatorPanel').style.display = 'block';
                document.getElementById('spectatorCloseBtn').style.display = 'block';

                // Close button
                document.getElementById('spectatorCloseBtn').onclick = (e) => {
                    e.stopPropagation();
                    exitSpectator();
                };

                // Mouse wheel zoom in / out
                const scrollHandler = (e) => {
                    if (!spectatorActive) return;
                    // Allow scroll only when pointer is over the panel (or anywhere)
                    // Using PageY to always respond so scroll zones outside viewport still zoom
                    spectatorCameraZoom = Math.max(0.25, Math.min(4.0,
                        spectatorCameraZoom - (e.deltaY > 0 ? 0.05 : -0.05)));
                    e.preventDefault();
                };
                document.addEventListener('wheel', scrollHandler, { passive: false });

                // Click-to-attach via panel items
                const listEl = document.getElementById('spectatorList');
                listEl.onclick = (e) => {
                    const entry = e.target.closest('[data-entity-id]');
                    if (entry) {
                        const id = parseInt(entry.dataset.entityId, 10);
                        spectatorTargetId = (spectatorTargetId === id) ? null : id;
                        buildSpectatorEntityList();
                    }
                };

                // Click "Free Camera" row
                const freeLabel = document.getElementById('spectatorFreeLabel');
                freeLabel.onclick = () => {
                    spectatorTargetId = null;
                    buildSpectatorEntityList();
                };

                // Leave reference so exitSpectator can clean them up
                window._spectatorScrollHandler = scrollHandler;

                console.log('[Spectator] Activated');
            } else {
                exitSpectator();
            }
        }

        function exitSpectator() {
            if (!spectatorActive) return;
            spectatorActive = false;
            spectatorTargetId = null;

            // Restore clean inputs
            inputs.left = inputs.right = inputs.jump = inputs.attack = inputs.down = false;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'input',
                    inputs: { left: false, right: false, jump: false, attack: false, down: false }
                }));
            }

            document.getElementById('spectatorPanel').style.display = 'none';
            if (window._spectatorScrollHandler) {
                document.removeEventListener('wheel', window._spectatorScrollHandler, false);
                delete window._spectatorScrollHandler;
            }
            console.log('[Spectator] Deactivated');
        }

        /** Rebuild the entity list from the current playerStates snapshot. */
        function buildSpectatorEntityList() {
            const listEl = document.getElementById('spectatorList');
            if (!listEl) return;

            // Collect and sort: bots (isBot flag) first, then humans; each group alphabetical
            const now = Date.now();
            const entries = [];
            for (const [id, states] of playerStates) {
                if (!states || !states.length) continue;
                const latest = states[states.length - 1];
                if (!latest) continue;
                const isBot   = id < 0;
                const isSelf  = id === myPlayerId;
                if (isSelf) continue;
                entries.push({ id, isBot, label: latest.sprite || `#${id}`, color: latest.color });
            }
            entries.sort((a, b) => {
                // Bots group first
                if (a.isBot !== b.isBot) return a.isBot ? -1 : 1;
                // Then alphabetical by label
                return a.label.localeCompare(b.label);
            });

            let html = '';
            for (let i = 0; i < entries.length; i++) {
                const ent     = entries[i];
                const tag     = ent.isBot ? '[BOT]' : '[P]';
                const selClass = spectatorTargetId === ent.id ? 'selected' : '';
                html += `<div class="spectatorEntry ${selClass}" data-entity-id="${ent.id}">
                    <span class="colourSwatch" style="background-color:${ent.color}"></span>
                    <span>${tag} ${ent.label}</span>
                </div>`;
            }

            listEl.innerHTML = html;
            updateSpectatorFreeLabel();
        }

        function updateSpectatorFreeLabel() {
            const el = document.getElementById('spectatorFreeLabel');
            if (!el) return;
            const sel = spectatorTargetId === null ? 'color:#b7e057;' : 'color:#555;';
            el.innerHTML = spectatorTargetId === null
                ? '&gt; Free Camera'
                : '&gt; Free Camera';
            el.setAttribute('style', sel);
        }

        function selectSpectatorTargetByIndex(index) {
            const listEl = document.getElementById('spectatorList');
            if (!listEl) return;
            const allEntries = listEl.querySelectorAll('.spectatorEntry');
            if (index < 0 || index >= allEntries.length) return;

            const id = parseInt(allEntries[index].dataset.entityId, 10);
            spectatorTargetId = (spectatorTargetId === id) ? null : id;
            buildSpectatorEntityList();
        }

        /** Call every frame to keep the entity list fresh with current world state. */
        function refreshSpectatorUI() {
            if (spectatorActive) buildSpectatorEntityList();
        }
    </script>
</body>
