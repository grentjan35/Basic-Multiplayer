<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia.io Multiplayer Combat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #888;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
        }

        #playerCount {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: #555;
            z-index: 10;
        }

        #fpsCounter {
            position: absolute;
            top: 30px;
            left: 10px;
            font-size: 12px;
            color: #555;
            z-index: 10;
        }

        #minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 80px;
            background-color: #0d0d0d;
            border: 1px solid #333;
            z-index: 10;
        }

        /* ── Spectator Panel ──────────────────────────────────── */
        #spectatorPanel {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 260px;
            max-height: 320px;
            background-color: rgba(14, 14, 14, 0.93);
            border: 1px solid #3a3a3a;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #9a9a9a;
            z-index: 20;
            overflow: hidden;
            user-select: none;
        }

        #spectatorHeader {
            padding: 5px 8px;
            background-color: #2a2a2a;
            border-bottom: 1px solid #3a3a3a;
            color: #b7e057;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #spectatorHint {
            padding: 3px 8px;
            font-size: 9px;
            color: #555;
            border-bottom: 1px solid #2a2a2a;
        }

        #spectatorList {
            overflow-y: auto;
            max-height: 240px;
        }

        #spectatorList::-webkit-scrollbar {
            width: 5px;
        }

        #spectatorList::-webkit-scrollbar-thumb {
            background-color: #3a3a3a;
        }

        .spectatorEntry {
            padding: 3px 8px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .spectatorEntry:hover,
        .spectatorEntry.selected {
            background-color: #2a3a1a;
            color: #b7e057;
        }

        .spectatorEntry .colourSwatch {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        #spectatorFreeLabel {
            padding: 3px 8px;
            cursor: pointer;
            color: #555;
        }

        #spectatorFreeLabel:hover {
            background-color: #2a2a2a;
            color: #9a9a9a;
        }

        #spectatorCloseBtn {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            background: none;
            border: none;
            color: #555;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 6px;
            font-family: 'Courier New', monospace;
        }

        #spectatorCloseBtn:hover {
            color: #b7e057;
        }
    </style>
</head>

        // ── Running state ───────────────────────────────────────────────────
        let INTERPOLATION_DELAY     = CLIENT_SMOOTH_MIN;  // current playback delay (ms)
        let smoothedJitter          = 0;                  // EWMA one-way jitter (ms)
        let smoothedQueueDepth      = 0;                  // EWMA backlog depth (ms)
        let lastServerSnapshotTime  = 0;                  // snapshotTime of last processed msg
        let lastClientArrivalTime   = 0;                  // client-receive time of same msg
        const rttSampleRing         = [];                 // one-way latency sample ring
        const RTT_RING_CAP          = 16;                 // ~0.5 s of history at 30 fps
        const playerStates          = new Map();           // per-player timestamped history
        
        // Animation state management

        // Input state - only for sending to server
        const inputs = {

        };

        // Cooldown to prevent attack from re-triggering every tick while held
        let attackInputSent = false;

        // Spectator mode state

        const SPECTATOR_CAMERA_ZOOM = 1.0;
        let spectatorCamera = { x: 0, y: 0 }; // World-space free-camera position when no target is set
        let spectatorCameraZoom = SPECTATOR_CAMERA_ZOOM; // Current zoom in spectator

        // Plus-key combo detection
        let plusPressCount = 0;
        let plusPressTimer = null;
        const PLUS_COMBO_WINDOW = 600; // ms — must press + 3 times within this window

        // Hitbox visualization (toggled with Shift+H)
        // Set HITBOX_TOGGLE_ENABLED to false to disable the Shift+H hotkey
        const HITBOX_TOGGLE_ENABLED = false;
        const HITBOX_LEFT_INSET = 14;
        const HITBOX_RIGHT_INSET = 0;
        const HITBOX_WIDTH = 40 - HITBOX_LEFT_INSET - HITBOX_RIGHT_INSET;
        const HITBOX_HEIGHT = 60;
        let showHitbox = false;

// ============================================================
// Bot AI Pathfinding System (simplified for browser)
// ============================================================
const PATHFINDING_GRID_SIZE = 32;
let pathfindingGrid = null;
let lastGridPlatforms = null;
let debugMode = false;
let botPaths = new Map();

function createPathfindingGrid(platforms, gridSize = PATHFINDING_GRID_SIZE) {
    if (!platforms || platforms.length === 0) return null;
    
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of platforms) {
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x + p.w);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y + p.h);
    }
    
    minX -= 100;
    maxX += 100;
    minY -= 100;
    maxY += 100;
    
    const cols = Math.ceil((maxX - minX) / gridSize);
    const rows = Math.ceil((maxY - minY) / gridSize);
    
    const grid = new Uint8Array(cols * rows).fill(0);
    
    for (const p of platforms) {
        const startCol = Math.floor((p.x - minX) / gridSize);
        const endCol = Math.floor((p.x + p.w - minX) / gridSize);
        const startRow = Math.floor((p.y - minY) / gridSize);
        const endRow = Math.floor((p.y + p.h - minY) / gridSize);
        
        for (let r = startRow; r <= endRow; r++) {
            for (let c = startCol; c <= endCol; c++) {
                if (r >= 0 && r < rows && c >= 0 && c < cols) {
                    grid[r * cols + c] = 1;
                }
            }
        }
    }
    
    return {
        grid,
        cols,
        rows,
        minX,
        minY,
        gridSize
    };
}

function worldToGrid(x, y, grid) {
    const col = Math.floor((x - grid.minX) / grid.gridSize);
    const row = Math.floor((y - grid.minY) / grid.gridSize);
    return { col, row };
}

function gridToWorld(col, row, grid) {
    const x = grid.minX + col * grid.gridSize + grid.gridSize / 2;
    const y = grid.minY + row * grid.gridSize + grid.gridSize / 2;
    return { x, y };
}

function isCellBlocked(col, row, grid) {
    if (row < 0 || row >= grid.rows || col < 0 || col >= grid.cols) {
        return true;
    }
    return grid.grid[row * grid.cols + col] === 1;
}

function heuristic(a, b) {
    return Math.abs(a.col - b.col) + Math.abs(a.row - b.row);
}

function findPathWithAvoidance(grid, startX, startY, endX, endY, botId, allBots) {
    const start = worldToGrid(startX, startY, grid);
    const end = worldToGrid(endX, endY, grid);
    
    if (isCellBlocked(start.col, start.row, grid)) {
        for (let dist = 1; dist < 10; dist++) {
            for (let dr = -dist; dr <= dist; dr++) {
                for (let dc = -dist; dc <= dist; dc++) {
                    if (Math.abs(dr) + Math.abs(dc) === dist) {
                        const nc = start.col + dc;
                        const nr = start.row + dr;
                        if (!isCellBlocked(nc, nr, grid)) {
                            start.col = nc;
                            start.row = nr;
                            break;
                        }
                    }
                }
                if (!isCellBlocked(start.col, start.row, grid)) break;
            }
            if (!isCellBlocked(start.col, start.row, grid)) break;
        }
    }
    
    if (isCellBlocked(end.col, end.row, grid)) {
        for (let dist = 1; dist < 10; dist++) {
            for (let dr = -dist; dr <= dist; dr++) {
                for (let dc = -dist; dc <= dist; dc++) {
                    if (Math.abs(dr) + Math.abs(dc) === dist) {
                        const nc = end.col + dc;
                        const nr = end.row + dr;
                        if (!isCellBlocked(nc, nr, grid)) {
                            end.col = nc;
                            end.row = nr;
                            break;
                        }
                    }
                }
                if (!isCellBlocked(end.col, end.row, grid)) break;
            }
            if (!isCellBlocked(end.col, end.row, grid)) break;
        }
    }
    
    const openSet = [];
    const closedSet = new Set();
    const cameFrom = new Map();
    const gScore = new Map();
    const fScore = new Map();
    
    const startKey = start.col + ',' + start.row;
    openSet.push(start);
    gScore.set(startKey, 0);
    fScore.set(startKey, heuristic(start, end));
    
    let steps = 0;
    
    while (openSet.length > 0 && steps < 1000) {
        steps++;
        
        openSet.sort((a, b) => {
            const keyA = a.col + ',' + a.row;
            const keyB = b.col + ',' + b.row;
            return (fScore.get(keyA) || Infinity) - (fScore.get(keyB) || Infinity);
        });
        
        const current = openSet.shift();
        const currentKey = current.col + ',' + current.row;
        
        if (current.col === end.col && current.row === end.row) {
            const path = [];
            let curr = current;
            while (curr) {
                const worldPos = gridToWorld(curr.col, curr.row, grid);
                path.unshift(worldPos);
                const key = curr.col + ',' + curr.row;
                curr = cameFrom.get(key);
            }
            return smoothPath(path);
        }
        
        closedSet.add(currentKey);
        
        const currentWorld = gridToWorld(current.col, current.row, grid);
        let isBlockedByBot = false;
        
        for (const [otherBotId, otherBot] of allBots) {
            if (otherBotId === botId) continue;
            
            const otherPos = otherBot;
            const dx = currentWorld.x - otherBot.x;
            const dy = currentWorld.y - otherBot.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 60) {
                isBlockedByBot = true;
                break;
            }
        }
        
        if (isBlockedByBot) continue;
        
        const neighbors = [
            { col: current.col, row: current.row - 1 },
            { col: current.col, row: current.row + 1 },
            { col: current.col - 1, row: current.row },
            { col: current.col + 1, row: current.row }
        ];
        
        for (const neighbor of neighbors) {
            const neighborKey = neighbor.col + ',' + neighbor.row;
            
            if (closedSet.has(neighborKey)) continue;
            if (isCellBlocked(neighbor.col, neighbor.row, grid)) continue;
            
            const neighborWorld = gridToWorld(neighbor.col, neighbor.row, grid);
            let isOccupiedByBot = false;
            
            for (const [otherBotId, otherBot] of allBots) {
                if (otherBotId === botId) continue;
                
                const otherPos = otherBot;
                const dx = neighborWorld.x - otherBot.x;
                const dy = neighborWorld.y - otherBot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 50) {
                    isOccupiedByBot = true;
                    break;
                }
            }
            
            if (isOccupiedByBot) continue;
            
            const tentativeG = (gScore.get(currentKey) || Infinity) + 1;
            
            if (tentativeG < (gScore.get(neighborKey) || Infinity)) {
                cameFrom.set(neighborKey, current);
                gScore.set(neighborKey, tentativeG);
                fScore.set(neighborKey, tentativeG + heuristic(neighbor, end));
                
                if (!openSet.some(n => n.col === neighbor.col && n.row === neighbor.row)) {
                    openSet.push(neighbor);
                }
            }
        }
    }
    
    return null;
}

function smoothPath(path) {
    if (path.length <= 2) return path;
    
    const smoothed = [path[0]];
    let lastIdx = 0;
    
    for (let i = 2; i < path.length; i++) {
        const dx = path[i].x - path[lastIdx].x;
        const dy = path[i].y - path[lastIdx].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < 300) {
            smoothed.push(path[i]);
            lastIdx = i;
        }
    }
    
    return smoothed;
}

function getBotPath(botId) {
    return botPaths.get(botId) || [];
}

function setDebugMode(enabled) {
    debugMode = enabled;
}

function renderDebugPaths(ctx, worldX, worldY, scale) {
    if (!showBotPaths) return;
    if (botPaths.size === 0) return;
    
    // Draw directly in world coords (camera transform is already active from render())
    for (const [botId, path] of botPaths) {
        if (path.length < 2) continue;
        
        const hue = ((botId < 0 ? -botId : botId) * 47 + 180) % 360;
        
        ctx.beginPath();
        ctx.strokeStyle = 'hsl(' + hue + ', 80%, 55%)';
        ctx.lineWidth = 3 / (scale || 1.3);
        ctx.setLineDash([10, 5]);
        
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) {
            ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();
        
        // Draw waypoint circles
        for (const point of path) {
            ctx.beginPath();
            ctx.fillStyle = 'hsl(' + hue + ', 80%, 55%)';
            ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
            ctx.fill();
            // Outline
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }
}
let showBotPaths = false;

        // Resize canvas to full window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Load images from base64 data URLs received via WebSocket (no HTTP requests)
        async function loadImagesFromData(characterList, imagesData) {
            try {
                const loadPromises = characterList.map(character => {
                    return new Promise((resolve) => {
                        const dataUrl = imagesData[character];
                        if (!dataUrl) {
                            console.warn(`No image data for ${character}, using fallback`);
                            // Try fallback
                            const fallbackUrl = imagesData['base'];
                            if (fallbackUrl) {
                                const img = new Image();
                                img.onload = () => {
                                    characterImages[character] = img;
                                    resolve();
                                };
                                img.onerror = resolve;
                                img.src = fallbackUrl;
                            } else {
                                resolve();
                            }
                            return;
                        }
                        
                        const img = new Image();
                        img.onload = () => {
                            characterImages[character] = img;
                            resolve();
                        };
                        img.onerror = () => {
                            console.error(`Failed to decode base64 image for ${character}`);
                            // Try fallback
                            const fallbackUrl = imagesData['base'];
                            if (fallbackUrl) {
                                const fallbackImg = new Image();
                                fallbackImg.onload = () => {
                                    characterImages[character] = fallbackImg;
                                    resolve();
                                };
                                fallbackImg.onerror = resolve;
                                fallbackImg.src = fallbackUrl;
                            } else {
                                resolve();
                            }
                        };
                        img.src = dataUrl;
                    });
                });
                
                await Promise.all(loadPromises);
                spritesheetLoaded = true;
                console.log(`Loaded ${characterList.length} character spritesheets from base64 data`);
            } catch (error) {
                console.error('Failed to load images from base64 data:', error);
                spritesheetLoaded = true; // Still allow fade-in even if spritesheets fail
            }
        }

        // Get frame coordinates from spritesheet using the character's own image
        function getFrameCoordinates(frameName, characterImage) {
            if (!spritesheetData || !spritesheetData.frames[frameName]) {
                return null;
            }
            
            const frame = spritesheetData.frames[frameName];
            const gridInfo = spritesheetData.spreadsheet_info.grid.split('x');
            const gridCols = parseInt(gridInfo[0]);
            const gridRows = parseInt(gridInfo[1]);
            
            // Use the provided character image to calculate frame dimensions
            const img = characterImage || Object.values(characterImages)[0];
            
            const frameWidth = img.width / gridCols;
            const frameHeight = img.height / gridRows;
            
            return {
                x: frame.col * frameWidth,
                y: frame.row * frameHeight,
                width: frameWidth,
                height: frameHeight,
                scale: frame.scale || 1.0, // Per-frame scale factor for oversized sprites
                yOffset: frame.yOffset || 0 // Per-frame y offset for positioning
            };
        }

        // Update player animation based on server state and input
        function updatePlayerAnimation(playerId, playerState) {
            if (!playerAnimations.has(playerId)) {
                playerAnimations.set(playerId, {
                    currentAnimation: 'idle',
                    frameIndex: 0,
                    lastFrameTime: Date.now(),
                    facingRight: true,
                    landingEndTime: 0,
                    hitEndTime: 0,
                    attackEndTime: 0,
                    attackAnimation: ''
                });
            }
            
            const anim = playerAnimations.get(playerId);
            const now = Date.now();
            
            // Use facingRight from server state
            if (playerState.facingRight !== undefined) {
                anim.facingRight = playerState.facingRight;
            } else if (playerState.vx < -0.1) {
                anim.facingRight = false;
            } else if (playerState.vx > 0.1) {
                anim.facingRight = true;
            }
            
            // Check if player is climbing - show falling/airborne pose
            if (playerState.isClimbing) {
                anim.currentAnimation = 'falling';
                anim.frameIndex = 0; // falling frame
                return;
            }
            
            // Check if player is dead - show dead sprite when on ground, falling when in air
            if (playerState.isDead) {
                if (playerState.onGround) {
                    anim.currentAnimation = 'death';
                    anim.frameIndex = 2; // dead frame
                } else {
                    anim.currentAnimation = 'falling';
                    anim.frameIndex = 0;
                }
                return;
            }
            
            // Check if player is doing an attack animation
            if (now < anim.attackEndTime) {
                anim.currentAnimation = anim.attackAnimation;
                // Show attack frame for the duration
                return;
            }
            
            // Check if we're in landing state
            if (now < anim.landingEndTime) {
                anim.currentAnimation = 'jump';
                anim.frameIndex = 2; // landing frame
                return;
            }
            
            // Determine animation based on server state
            let targetAnimation = 'idle';
            
            if (!playerState.onGround) {
                // Check if actually falling downward vs going up
                if (playerState.vy > 0) {
                    // Falling downward - use falling pose
                    targetAnimation = 'falling';
                    anim.frameIndex = 0;
                } else {
                    // Going up or at peak - use mid-air pose
                    targetAnimation = 'jump';
                    anim.frameIndex = 1; // in_air frame
                }
                anim.currentAnimation = targetAnimation;
                return;
            } else {
                // On ground
                const speed = Math.abs(playerState.vx);
                if (speed > 0.5) {
                    targetAnimation = 'run';
                } else {
                    targetAnimation = 'idle';
                }
            }
            
            // Reset animation if changed
            if (anim.currentAnimation !== targetAnimation) {
                anim.currentAnimation = targetAnimation;
                anim.frameIndex = 0;
                anim.lastFrameTime = now;
            }
            
            // Update frame based on animation speed and momentum
            if (targetAnimation === 'run') {
                const speed = Math.abs(playerState.vx);
                const animationSpeed = Math.max(80, 250 - speed * 15); // Balanced speed
                if (now - anim.lastFrameTime > animationSpeed) {
                    const frames = spritesheetData.animations[targetAnimation];
                    if (frames) {
                        anim.frameIndex = (anim.frameIndex + 1) % frames.length;
                        anim.lastFrameTime = now;
                        // Play footstep SFX every dynamic run-cycle on this player
                        tryFootstepWithInterval(anim, playerState.x, playerState.y);
                    }
                }
            } else {
                const animationSpeed = 200; // ms per frame for idle
                if (now - anim.lastFrameTime > animationSpeed) {
                    const frames = spritesheetData.animations[targetAnimation];
                    if (frames) {
                        anim.frameIndex = (anim.frameIndex + 1) % frames.length;
                        anim.lastFrameTime = now;
                    }
                }
            }
        }

        // Trigger landing animation
        function triggerLanding(playerId) {
            if (!playerAnimations.has(playerId)) {
                playerAnimations.set(playerId, {
                    currentAnimation: 'idle',
                    frameIndex: 0,
                    lastFrameTime: Date.now(),
                    facingRight: true,
                    landingEndTime: 0,
                    hitEndTime: 0,
                    attackEndTime: 0,
                    attackAnimation: ''
                });
            }
            
            const anim = playerAnimations.get(playerId);
            anim.landingEndTime = Date.now() + 200; // Show landing for 200ms
        }

        // Trigger attack animation based on combo stage
        function triggerAttackAnimation(playerId, comboStage) {
            if (!playerAnimations.has(playerId)) {
                playerAnimations.set(playerId, {
                    currentAnimation: 'idle',
                    frameIndex: 0,
                    lastFrameTime: Date.now(),
                    facingRight: true,
                    landingEndTime: 0,
                    hitEndTime: 0,
                    attackEndTime: 0,
                    attackAnimation: ''
                });
            }
            
            const anim = playerAnimations.get(playerId);
            
            // Map combo stage to attack animation frame (5-stage: jab→cross→jab→cross→kick)
            let frameName = '';
            if (comboStage === 1 || comboStage === 3) {
                frameName = 'jab';
            } else if (comboStage === 2 || comboStage === 4) {
                frameName = 'cross';
            } else if (comboStage === 5) {
                frameName = 'kick';
            }
            
            anim.attackAnimation = frameName;
            anim.attackEndTime = Date.now() + 300; // Show attack for 300ms
            anim.currentAnimation = frameName;
            anim.frameIndex = 0;
        }

        // Get current frame for player, using their own character image
        function getCurrentPlayerFrame(playerId, characterImage) {
            const anim = playerAnimations.get(playerId);
            if (!anim || !spritesheetData) {
                return null;
            }
            
            // IMPORTANT: Hit animation takes priority over attack animation
            // If the player is in hit stun, show the hit frame
            if (anim.currentAnimation === 'hit') {
                const frames = spritesheetData.animations['hit'];
                if (frames && frames.length > 0) {
                    const frameName = frames[0]; // Always show frame 0 for hit
                    return getFrameCoordinates(frameName, characterImage);
                }
            }
            
            // Check if we're showing an attack animation (jab, cross, kick)
            if (anim.attackAnimation && Date.now() < anim.attackEndTime) {
                const frame = spritesheetData.frames[anim.attackAnimation];
                if (frame) {
                    return getFrameCoordinates(anim.attackAnimation, characterImage);
                }
            }
            
            const frames = spritesheetData.animations[anim.currentAnimation];
            if (!frames || frames.length === 0) {
                return null;
            }
            
            const frameName = frames[anim.frameIndex];
            return getFrameCoordinates(frameName, characterImage);
        }

        // Interpolate between two states — render-authoritative, no client prediction
        function interpolateState(state1, state2, alpha) {
            return {
                x: state1.x + (state2.x - state1.x) * alpha,
                y: state1.y + (state2.y - state1.y) * alpha,
                vx: state1.vx + (state2.vx - state1.vx) * alpha,
                vy: state1.vy + (state2.vy - state1.vy) * alpha,
                onGround: state2.onGround,
                color: state1.color,
                sprite: state1.sprite,
                health: state1.health,
                maxHealth: state1.maxHealth,
                comboStage: state1.comboStage,
                attackActive: state1.attackActive,
                facingRight: state1.facingRight,
                isDead: state2.isDead,
                opacity: state2.opacity,
                isFadingIn: state2.isFadingIn
            };
        }

        // ── Snapshot ────────────────────────────────────────────────────────
        // Immutable inbox record for every incoming state message.
        // Uses server-emitted snapshotTime for stable jitter measurement
        // (avoids conflating server scheduling variance with network jitter).
        function Snapshot(data) {
            this.frame           = data.frame         || 0;
            this.snapshotTime    = data.snapshotTime  || Date.now();
            this.clientRecvTime  = Date.now();          // stamped at instant of arrival
            this.players         = data.players       || [];
        }

        // ── updateInterpolationDelay ─────────────────────────────────────────
        // Two-signal system:
        //   Signal 1 — one-way jitter  : midpoint of server-gap + client-delivery-gap,
        //                                  de-biased by trimming the middle 70 % of
        //                                  the sample ring before computing range.
        //   Signal 2 — queue depth     : how many ms of backlog are accumulating in
        //                                  the local buffer vs ideal tick spacing.
        // Both are EWMA-smoothed, independently clamped, then combined into a
        // single playback-delay value that the render loop reads every frame.
        function updateInterpolationDelay(msg) {
            const snap = new Snapshot(msg);

            // ── Signal 1: one-way jitter ────────────────────────────────────
            if (lastServerSnapshotTime > 0) {
                const serverGap      = snap.snapshotTime  - lastServerSnapshotTime;
                const deliveryGap    = snap.clientRecvTime - lastClientArrivalTime;

                // No clock sync needed — midpoint is a stable one-way estimate
                const oneWay = (deliveryGap + serverGap) / 2;

                // Reject processing spikes (2 ms floor, 2 s ceiling)
                if (oneWay > 2 && oneWay < 2_000) {
                    rttSampleRing.push({ oneWay, t: snap.snapshotTime });
                    if (rttSampleRing.length > RTT_RING_CAP) rttSampleRing.shift();
                }
            }
            lastServerSnapshotTime = snap.snapshotTime;
            lastClientArrivalTime  = snap.clientRecvTime;

            // Compute jitter from the trimmed middle 70 % of the ring
            // (drops ~15 % worst outliers on each side — far more robust than std-dev)
            if (rttSampleRing.length >= 4) {
                const sorted  = [...rttSampleRing].sort((a, b) => a.oneWay - b.oneWay);
                const drop    = Math.floor(sorted.length * 0.15);
                const trimmed = sorted.slice(drop, sorted.length - drop);
                const range   = trimmed[trimmed.length - 1].oneWay - trimmed[0].oneWay;
                // Half the inter-quartile range ≈ robust standard-deviation proxy
                const rawJitter = range / 2;

                smoothedJitter += SMOOTH_JITTER_RATE * (rawJitter - smoothedJitter);
            }

            // ── Signal 2: queue depth ───────────────────────────────────────
            // Gap between consecutive arrivals vs ideal tick spacing.
            // Depth accumulates only on slowdown, drains immediately on recovery.
            const expectedGap      = TICK_INTERVAL_MS;
            const actualArrivalGap = lastClientArrivalTime > 0
                ? snap.clientRecvTime - lastClientArrivalTime
                : expectedGap;

            // Positive = delivery was slower than ideal → backlog growing
            const depthSample = Math.max(0, expectedGap - actualArrivalGap);

            // Cap contribution so a sustained stall can never push total delay past ~350 ms
            smoothedQueueDepth += SMOOTH_QUEUE_RATE * (depthSample - smoothedQueueDepth);
            smoothedQueueDepth  = Math.max(0, smoothedQueueDepth);

            // ── Combine & clamp ─────────────────────────────────────────────
            const targetDelay = CLIENT_SMOOTH_MIN + smoothedJitter + smoothedQueueDepth;
            const clamped     = Math.max(CLIENT_SMOOTH_MIN,
                                         Math.min(CLIENT_SMOOTH_MAX, targetDelay));

            // Step toward target at most 3 ms per frame (~33 frames to reach ceiling)
            INTERPOLATION_DELAY += Math.sign(clamped - INTERPOLATION_DELAY)
                                 * Math.min(3, Math.abs(clamped - INTERPOLATION_DELAY));
        }

        // ── getInterpolatedPlayerState ──────────────────────────────────────
        // Binary-search the per-player timestamp buffer for the pair of snapshots
        // that straddle (now − INTERPOLATION_DELAY).
        function getInterpolatedPlayerState(playerId) {
            const states = playerStates.get(playerId);
            if (!states || states.length < 2) return null;

            const renderTime = Date.now() - INTERPOLATION_DELAY;

            // Binary search — states are time-ordered
            let lo = 0, hi = states.length - 2, best = -1;
            while (lo <= hi) {
                const mid = (lo + hi) >>> 1;
                if (states[mid + 1].timestamp > renderTime) {
                    best = mid;
                    hi  = mid - 1;
                } else {
                    lo = mid + 1;
                }
            }

            if (best < 0) {
                // Render time is past the newest snapshot — extrapolate from last pair
                const prev = states[states.length - 2];
                const next = states[states.length - 1];
                const alpha = (renderTime - prev.timestamp) / (next.timestamp - prev.timestamp);
                return interpolateState(prev, next, Math.max(0, Math.min(1, alpha)));
            }

            const prevState = states[best];
            const nextState = states[best + 1];
            const timeDiff  = nextState.timestamp - prevState.timestamp;

            if (timeDiff <= 0) return nextState; // same-tick edge, avoid div-by-zero

            const alpha = (renderTime - prevState.timestamp) / timeDiff;
            return interpolateState(prevState, nextState, Math.max(0, Math.min(1, alpha)));
        }

        // Connect to server
        function connect() {
            // Always use the current host for WebSocket connection
            // This works for both localhost and Hugging Face
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsHost = window.location.host;
            const wsUrl = `${wsProtocol}//${wsHost}`;
            
            console.log('Connecting to WebSocket at:', wsUrl);
            
            // Close existing connection if any
            if (ws && ws.readyState !== WebSocket.CLOSED) {
                ws.close();
            }
            
            ws = new WebSocket(wsUrl);
            
            // Add connection timeout
            setTimeout(() => {
                if (ws && ws.readyState === WebSocket.CONNECTING) {
                    console.log('Connection timeout, closing and retrying...');
                    ws.close();
                }
            }, 5000);
            
            ws.onopen = () => {
                console.log('WebSocket connected successfully');
                playerCount.textContent = 'Connected to server';
            };
            
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                const timestamp = Date.now();
                
                if (data.type === 'init') {
                    myPlayerId = data.id;
                    platforms = data.platforms;
                    worldWidth = data.worldWidth;
                    worldHeight = data.worldHeight;
                    
                    // Load spritesheet data from WebSocket (not HTTP)
                    spritesheetData = data.spritesheetData;
                    
                    // Load images from base64 data URLs (no HTTP requests - invisible in Dev Tools)
                    if (data.images && data.characters && !spritesheetLoaded) {
                        await loadImagesFromData(data.characters, data.images);
                        gameDataReceived = true;
                        checkLoadingComplete();
                    } else {
                        gameDataReceived = true;
                        checkLoadingComplete();
                    }
                } else if (data.type === 'state') {
                    // Mark game data as received on first state update
                    if (!gameDataReceived && myPlayerId) {
                        gameDataReceived = true;
                        checkLoadingComplete();
                    }
                    // Update adaptive interpolation delay from jitter measurements
                    updateInterpolationDelay(data);
                    // Store state with timestamp for interpolation
                    for (const player of data.players) {
                        if (!playerStates.has(player.id)) {
                            playerStates.set(player.id, []);
                        }
                        const states = playerStates.get(player.id);
                        // Check if this new state has gotHit flag and trigger animation
                        const gotHit = player.gotHit === true;
                        
                        // Check if this state has an active attack (for animation)
                        const attackActive = player.attackActive === true;
                        const comboStage = player.comboStage || 0;
                        
                        states.push({
                            x: player.x,
                            y: player.y,
                            vx: player.vx,
                            vy: player.vy,
                            onGround: player.onGround,
                            color: player.color,
                            sprite: player.sprite,
                            gotHit: gotHit,
                            health: player.health,
                            maxHealth: player.maxHealth,
                            comboStage: comboStage,
                            attackActive: attackActive,
                            facingRight: player.facingRight,
                            isDead: player.isDead,
                            opacity: player.opacity,
                            isFadingIn: player.isFadingIn,
                            timestamp: timestamp
                        });
                        
                        // If gotHit is true, trigger hit animation on this player
                        if (gotHit) {
                            if (!playerAnimations.has(player.id)) {
                                playerAnimations.set(player.id, {
                                    currentAnimation: 'idle',
                                    frameIndex: 0,
                                    lastFrameTime: Date.now(),
                                    facingRight: true,
                                    landingEndTime: 0,
                                    hitEndTime: 0,
                                    attackEndTime: 0,
                                    attackAnimation: ''
                                });
                            }
                            const anim = playerAnimations.get(player.id);
                            anim.hitEndTime = Date.now() + 300; // Show hit for 300ms
                            anim.facingRight = player.vx > -0.1; // Face the direction of momentum
                        }
                        
                        // Trigger attack animation if attack is active
                        if (attackActive && comboStage > 0) {
                            triggerAttackAnimation(player.id, comboStage);
                        }
                        
                        // Keep only last 600 ms of states
                        while (states.length > 0 && timestamp - states[0].timestamp > 600) {
                            states.shift();
                        }
                    }
                    
                    // Remove states for disconnected players
                    const currentIds = new Set(data.players.map(p => p.id));
                    for (const [id, states] of playerStates) {
                        if (!currentIds.has(id)) {
                            playerStates.delete(id);
                        }
                    }
                    
                    playerCount.textContent = `Players: ${data.players.length}`;
                    
                    // ---- Store bot paths from server (for Shift+D debug) ----
                    if (data.botPaths) {
                        botPaths.clear();
                        for (const [botId, pathData] of Object.entries(data.botPaths)) {
                            if (pathData && pathData.length > 1) {
                                botPaths.set(parseInt(botId), pathData);
                            }
                        }
                    }
                    
// ---- Server-sent audio events (3D spatial) ----
                     if (Array.isArray(data.audioEvents)) {
                         for (const ev of data.audioEvents) {
                             // Deduplicate by constructing a unique event key
                             const eventKey = `${ev.playerId}-${ev.type}-${ev.clip || ''}`;
                             if (consumedAudioEvents.has(eventKey)) continue;
                             consumedAudioEvents.add(eventKey);
                             // Allow events from this same player+type to fire again after a short timeout
                             setTimeout(() => consumedAudioEvents.delete(eventKey), 1000);
                             
                             const clip = ev.clip || (ev.type === 'land'  && 'feet thud.wav') ||
                                                     (ev.type === 'hurt' && 'hurt.mp3') ||
                                                     (ev.type === 'death' && 'dead.mp3') || null;
                             if (clip) {
                                 // Pass isHurt=true for hurt/death sounds to cap their volume
                                 // Pass isAttack=true for attack sounds to boost their volume
                                 const isHurt = ev.type === 'hurt' || ev.type === 'death';
                                 const isAttack = ev.type === 'attack';
                                 playClipAt(clip, ev.x, ev.y, isHurt, isAttack);
                             }
                         }
                     }
                }
            };
            
            ws.onclose = (event) => {
                console.log('WebSocket disconnected. Code:', event.code, 'Reason:', event.reason);
                playerCount.textContent = 'Disconnected - Reconnecting...';
                setTimeout(connect, 2000);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                console.error('WebSocket readyState:', ws.readyState);
                playerCount.textContent = 'Connection error - Retrying...';
            };
        }

        // Send input to server
        function sendInput() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'input',
                    inputs: {
                        left: inputs.left,
                        right: inputs.right,
                        jump: inputs.jump,
                        attack: inputs.attack,
                        down: inputs.down
                    }
                }));
            }
        }

        // Input handlers
        document.addEventListener('keydown', (e) => {

            // ── Spectator triple-plus combo ─ Ctrl + + + + (key === 'Equal')
            if (e.code === 'Equal' && e.ctrlKey) {
                e.preventDefault();
                const now = Date.now();
                if (plusPressTimer && now - plusPressTimer < PLUS_COMBO_WINDOW) {
                    plusPressCount++;
                } else {
                    plusPressCount = 1;
                }
                plusPressTimer = now;
                if (plusPressCount >= 3) {
                    plusPressCount = 0;
                    plusPressTimer = null;
                    toggleSpectator();
                }
                return;
            }

            // ── Escape exits spectator ──────────────────────────
            if (e.code === 'Escape' && spectatorActive) {
                e.preventDefault();
                exitSpectator();
                return;
            }

            if (spectatorActive) {
                // ── Spectator free-camera: WASD + QE ─────────────
                // Letter keys W/A/S/D → WASD
                if (e.code === 'KeyW' || e.code === 'ArrowUp')    { e.preventDefault(); spectatorCamera.y -= 12; }
                if (e.code === 'KeyS' || e.code === 'ArrowDown')  { e.preventDefault(); spectatorCamera.y += 12; }
                if (e.code === 'KeyA' || e.code === 'ArrowLeft')  { e.preventDefault(); spectatorCamera.x -= 12; }
                if (e.code === 'KeyD' || e.code === 'ArrowRight') { e.preventDefault(); spectatorCamera.x += 12; }
                if (e.code === 'KeyQ') { e.preventDefault(); spectatorCameraZoom = Math.max(0.25, spectatorCameraZoom - 0.05); }
                if (e.code === 'KeyE') { e.preventDefault(); spectatorCameraZoom = Math.min(4.0, spectatorCameraZoom + 0.05); }

                // Number keys 1–9: select entity from the panel list
                const num = parseInt(e.key);
                if (!isNaN(num) && num >= 1 && num <= 9) {
                    e.preventDefault();
                    selectSpectatorTargetByIndex(num - 1);
                }
                return;
            }

            // ── Debug toggles ─────────────────────────────────────
            if (e.shiftKey && e.code === 'KeyD') {
                e.preventDefault();
                showBotPaths = !showBotPaths;
                console.log('Bot paths debug:', showBotPaths ? 'ON' : 'OFF');
                // Tell the server to start/stop sending bot path data
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'debug',
                        debugBotPaths: showBotPaths
                    }));
                }
                if (showBotPaths) {
                    console.log('Bot path debug ON - server will send path data');
                }
                return;
            }

            // ── Normal player input ─────────────────────────────
            switch(e.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    inputs.left = true;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    inputs.right = true;
                    break;
                case 'ArrowUp':
                case 'KeyW':
                    inputs.jump = true;
                    break;
                case 'Space':
                    // Space = attack, not jump
                    if (!attackInputSent) {
                        inputs.attack = true;
                        attackInputSent = true;
                    }
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    inputs.down = true;
                    break;
            }
            sendInput();
        });

        document.addEventListener('keyup', (e) => {
            if (spectatorActive) return; // no game inputs in spectator mode

            switch(e.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    inputs.left = false;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    inputs.right = false;
                    break;
                case 'ArrowUp':
                case 'KeyW':
                    inputs.jump = false;
                    break;
                case 'Space':
                    inputs.attack = false;
                    attackInputSent = false;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    inputs.down = false;
                    break;
                case 'KeyH':
                    if (e.shiftKey && HITBOX_TOGGLE_ENABLED) {
                        showHitbox = !showHitbox;
                    }
                    break;
            }
            sendInput();
        });

        // Performance monitoring
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let fpsUpdateTime = 0;

        // Draw hitbox outline for a player (dotted rectangle showing collision area)
        function drawHitbox(player) {
            const hx = player.x + HITBOX_LEFT_INSET;
            const hy = player.y;
            
            ctx.save();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = 'rgba(255, 255, 100, 0.8)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(hx, hy, HITBOX_WIDTH, HITBOX_HEIGHT);
            ctx.restore();
        }

        // Draw health bar for a player
        function drawHealthBar(player) {
            const barWidth = 40;
            const barHeight = 5;
            const barX = player.x + 10; // Small right offset to center over visual sprite
            const barY = player.y - 12; // Above the player
            
            const health = player.health !== undefined ? player.health : 100;
            const maxHealth = player.maxHealth !== undefined ? player.maxHealth : 100;
            const healthPercent = Math.max(0, health / maxHealth);
            
            // Apply opacity for fade in/out
            const opacity = player.opacity !== undefined ? player.opacity : 1.0;
            ctx.save();
            ctx.globalAlpha = opacity;
            
            // Background (dark)
            ctx.fillStyle = '#333';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            
            // Health fill - green to red based on percentage
            const r = Math.round(255 * (1 - healthPercent));
            const g = Math.round(255 * healthPercent);
            ctx.fillStyle = `rgb(${r}, ${g}, 30)`;
            ctx.fillRect(barX, barY, barWidth * healthPercent, barHeight);
            
            // Border
            ctx.strokeStyle = '#555';
            ctx.strokeRect(barX, barY, barWidth, barHeight);
            
            // Health text (small, above bar)
            ctx.fillStyle = '#aaa';
            ctx.font = '8px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`${Math.ceil(health)}/${maxHealth}`, barX + barWidth / 2, barY - 2);
            
            ctx.restore();
        }

        // Draw a single player with their character spritesheet
        function drawPlayer(player) {
            // Update animation for all players using server state
            updatePlayerAnimation(player.id, player);
            
            // Check for landing (transition from air to ground) — 3D thud sound
            const prevStates = playerStates.get(player.id);
            if (prevStates && prevStates.length >= 2) {
                const prevState = prevStates[prevStates.length - 2];
                const currState = prevStates[prevStates.length - 1];
                if (!prevState.onGround && currState.onGround) {
                    triggerLanding(player.id);
                    // Play landing thud at this player's position (3D spatial)
                    tryLanding(player);
                    // Footstep SFX on landing — counter = threshold so it fires immediately
                    stepTriggerCounter = stepInterval;
                }
            }
            
            // Track onGround changes for any later audio hooks
            const prevGround = _prevOnGround.get(player.id);
            _prevOnGround.set(player.id, player.onGround);
            
            // Draw health bar above player
            drawHealthBar(player);
            
            // Get the character's spritesheet image
            const spriteName = player.sprite || Object.keys(characterImages)[0];
            const characterImage = characterImages[spriteName];
            
            // Draw sprite if loaded, otherwise fallback to rectangle
            if (spritesheetLoaded && characterImage) {
                const frame = getCurrentPlayerFrame(player.id, characterImage);
                const anim = playerAnimations.get(player.id);
                
                if (frame && anim) {
                    // Scale proportionally to a consistent height of 60px
                    // No cropping — preserves aspect ratio for any image size
                    const targetHeight = 60;
                    const frameScaleFactor = frame.scale || 1.0; // Per-frame scale for oversized sprites
                    const scale = (targetHeight / frame.height) * frameScaleFactor;
                    const drawWidth = Math.round(frame.width * scale);
                    const drawHeight = Math.round(frame.height * scale);
                    
                    // Center the sprite if a per-frame scale is applied (so it shrinks from center, not top-left)
                    const normalWidth = Math.round(frame.width * (targetHeight / frame.height));
                    const normalHeight = targetHeight;
                    const offsetX = Math.round((normalWidth - drawWidth) / 2);
                    const offsetY = Math.round((normalHeight - drawHeight) / 2) + (frame.yOffset || 0);
                    
                    ctx.save();
                    
                    // Apply opacity for fade in/out
                    const opacity = player.opacity !== undefined ? player.opacity : 1.0;
                    ctx.globalAlpha = opacity;
                    
                    // Flip sprite if facing left
                    if (!anim.facingRight) {
                        ctx.translate(player.x + drawWidth + offsetX, player.y + offsetY);
                        ctx.scale(-1, 1);
                        ctx.drawImage(
                            characterImage,
                            frame.x, frame.y, frame.width, frame.height,
                            0, 0, drawWidth, drawHeight
                        );
                    } else {
                        ctx.drawImage(
                            characterImage,
                            frame.x, frame.y, frame.width, frame.height,
                            player.x + offsetX, player.y + offsetY, drawWidth, drawHeight
                        );
                    }
                    
                    ctx.restore();
                } else {
                    // Fallback to rectangle if frame not found
                    ctx.fillStyle = player.color;
                    ctx.fillRect(player.x, player.y, 40, 60);
                    ctx.strokeStyle = '#444';
                    ctx.strokeRect(player.x, player.y, 40, 60);
                }
            } else {
                // Fallback to rectangle if spritesheet not loaded
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x, player.y, 40, 60);
                ctx.strokeStyle = '#444';
                ctx.strokeRect(player.x, player.y, 40, 60);
            }
        }

        // Render function - CLIENT ONLY, no physics
        function render() {
            const currentTime = performance.now();
            const deltaTime = currentTime - lastFrameTime;
            lastFrameTime = currentTime;
            
            // Update FPS counter every 500ms
            frameCount++;
            if (currentTime - fpsUpdateTime > 500) {
                const fps = Math.round(frameCount * 1000 / (currentTime - fpsUpdateTime));
                fpsCounter.textContent = `FPS: ${fps}`;
                frameCount = 0;
                fpsUpdateTime = currentTime;
            }

            // Fade out effect - transition from black to visible (only after loading is complete)
            if (loadingComplete && fadeAlpha > 0) {
                fadeAlpha = Math.max(0, fadeAlpha - 0.02);
            }
            
            // Clear canvas
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Get interpolated player states
            const interpolatedPlayers = [];
            for (const [playerId, states] of playerStates) {
                const state = getInterpolatedPlayerState(playerId);
                if (state) {
                    interpolatedPlayers.push({ id: playerId, ...state });
                }
            }
            
            // Find local player for camera
            let localPlayer = null;
            for (const player of interpolatedPlayers) {
                if (player.id === myPlayerId) {
                    localPlayer = player;
                    break;
                }
            }

            // ── Camera: normal (follow local player) or spectator (free / tracked) ──
            let cameraCX, cameraCY;
            const CAMERA_ZOOM = spectatorActive ? spectatorCameraZoom : 1.3;

            if (spectatorActive && spectatorTargetId !== null) {
                // ── Spectator: camera locked to targeted entity ─────────────────
                const target = interpolatedPlayers.find(p => p.id === spectatorTargetId);
                if (target) {
                    cameraCX = target.x + PLAYER_WIDTH  / 2;
                    cameraCY = target.y + PLAYER_HEIGHT / 2;
                } else {
                    // Target vanished — fall back to free camera
                    cameraCX = spectatorCamera.x;
                    cameraCY = spectatorCamera.y;
                }
            } else if (spectatorActive) {
                // ── Spectator: free-camera (WASD moves spectatorCamera) ─────────
                cameraCX = spectatorCamera.x;
                cameraCY = spectatorCamera.y;
            } else {
                // ── Normal: follow local player ──────────────────────────────────
                if (localPlayer) {
                    cameraCX = localPlayer.x + PLAYER_WIDTH  / 2;
                    cameraCY = localPlayer.y + PLAYER_HEIGHT / 2;
                }
            }

            // ---- Update 3D audio listener position ──────────────────────────────
            if (audioCtx && audioManager && cameraCX !== undefined) {
                audioManager.updateListener(cameraCX, cameraCY);

                // Update camera bounds for screen visibility checks
                const viewWorldWidth  = canvas.width / CAMERA_ZOOM;
                const viewWorldHeight = canvas.height / CAMERA_ZOOM;
                audioManager.updateCamera(cameraCX - viewWorldWidth / 2,
                                          cameraCY - viewWorldHeight / 2,
                                          viewWorldWidth, viewWorldHeight);
            }

            ctx.save();

            // Apply zoom centred on camera point
            if (cameraCX !== undefined) {
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
                ctx.translate(-cameraCX, -cameraCY);
            } else {
                ctx.translate(0, 0);
            }
            
             // Draw platforms with altitude-based coloring
             for (const plat of platforms) {
                 // Calculate altitude ratio (0 = bottom, 1 = top of world)
                 const altitudeRatio = plat.y / worldHeight;
                 
                 // Color gradient based on height:
                 // Ground level (y near worldHeight): dark gray
                 // Mid levels: progressively lighter/brighter
                 // Top levels: bright highlights
                 let r, g, b;
                 if (altitudeRatio > 0.85) {
                     // Ground level - dark warm gray
                     r = 42; g = 42; b = 42;
                 } else if (altitudeRatio > 0.7) {
                     // Low platforms - slightly lighter
                     r = 55; g = 58; b = 55;
                 } else if (altitudeRatio > 0.5) {
                     // Mid platforms - medium tone
                     r = 68; g = 72; b = 68;
                 } else if (altitudeRatio > 0.3) {
                     // High platforms - lighter
                     r = 85; g = 90; b = 85;
                 } else if (altitudeRatio > 0.15) {
                     // Very high - bright
                     r = 105; g = 112; b = 105;
                 } else {
                     // Top of world - brightest with slight blue tint
                     r = 130; g = 140; b = 135;
                 }
                 
                 ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                 ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                 
                 // Add subtle highlight on top edge
                 ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 + altitudeRatio * 0.15})`;
                 ctx.lineWidth = 1;
                 ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
             }
            
            // Draw players with interpolation
            for (const player of interpolatedPlayers) {
                // Skip local player entity in spectator mode (they're removed from the world visually)
                if (spectatorActive && player.id === myPlayerId) continue;
                drawPlayer(player);
            }
            
            // Draw hitboxes on top if toggled on (Shift+H)
            if (showHitbox) {
                for (const player of interpolatedPlayers) {
                    drawHitbox(player);
                }
            }

            // Draw bot paths on top if debug mode is enabled (Shift+D)
            if (showBotPaths && botPaths.size > 0) {
                // Camera transform is already active (ctx already translated/scaled),
                // so we draw paths directly in world-space coordinates
                renderDebugPaths(ctx, 0, 0, CAMERA_ZOOM);
            }
            
            ctx.restore();

            // Draw black overlay during loading/fade
            if (fadeAlpha > 0) {
                ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
             if (worldWidth > 0 && worldHeight > 0) {
                minimapCtx.fillStyle = '#0d0d0d';
                minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);
                
                // ── Mini-map camera: mirrors spectator state ────────────────────
                let mapCamX, mapCamY;
                if (spectatorActive) {
                    // Target entity
                    if (spectatorTargetId !== null) {
                        const trg = interpolatedPlayers.find(p => p.id === spectatorTargetId);
                        if (trg) { mapCamX = trg.x; mapCamY = trg.y; }
                    }
                    // Free camera fallback
                    if (mapCamX === undefined) { mapCamX = spectatorCamera.x; }
                    if (mapCamY === undefined) { mapCamY = spectatorCamera.y; }
                } else {
                    // Normal: center minimap on local player
                    for (const p of interpolatedPlayers) {
                        if (p.id === myPlayerId) { mapCamX = p.x; mapCamY = p.y; break; }
                    }
                }
                
                // Zoom level - show more of the world (higher = shows more)
                const zoomLevel = 0.5;
                const viewWidth = worldWidth * zoomLevel;
                const viewHeight = worldHeight * zoomLevel;
                
                // Camera position on mini-map
                let cameraX = mapCamX !== undefined ? mapCamX - viewWidth  / 2 : 0;
                let cameraY = mapCamY !== undefined ? mapCamY - viewHeight / 2 : 0;

                // Clamp camera to world bounds
                cameraX = Math.max(0, Math.min(cameraX, worldWidth - viewWidth));
                cameraY = Math.max(0, Math.min(cameraY, worldHeight - viewHeight));
                
                const scaleX = minimapCanvas.width / viewWidth;
                const scaleY = minimapCanvas.height / viewHeight;
                
                // Draw platforms on mini-map
                minimapCtx.fillStyle = '#2a2a2a';
                for (const plat of platforms) {
                    const minimapX = (plat.x - cameraX) * scaleX;
                    const minimapY = (plat.y - cameraY) * scaleY;
                    const minimapW = plat.w * scaleX;
                    const minimapH = plat.h * scaleY;
                    minimapCtx.fillRect(minimapX, minimapY, minimapW, minimapH);
                }
                
                // Draw players on mini-map
                for (const player of interpolatedPlayers) {
                    // Hide local player dot in spectator mode (they don't have a visible body)
                    if (spectatorActive && player.id === myPlayerId) continue;

                    const minimapX = (player.x - cameraX) * scaleX;
                    const minimapY = (player.y - cameraY) * scaleY;
                    
                    if (spectatorActive && player.id === spectatorTargetId) {
                        minimapCtx.fillStyle = '#b7e057'; // bright highlight for spectated target
                    } else if (player.id === myPlayerId) {
                        minimapCtx.fillStyle = '#666';
                    } else {
                        minimapCtx.fillStyle = player.color;
                    }
                    
                    minimapCtx.beginPath();
                    minimapCtx.arc(minimapX, minimapY, 3, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            }

            // Refresh spectator entity list each frame
            refreshSpectatorUI();

            requestAnimationFrame(render);
        }

        // Add an event listener to check for initial window load (assets can start loading early)
        window.addEventListener('load', () => {
            // Even if spritesheets aren't loaded yet, this ensures we're tracking state
            console.log('Window fully loaded');
        });

        // Initialize
        connect();

        // =============================================================
        // SFX AUDIO SYSTEM — WebAudio with 3D distance rolloff
        // =============================================================

        let audioCtx = null;
        let audioManager = null;  // lazy-init once audioCtx is ready
        const sfxBuffers = {};          // filename → decoded AudioBuffer
        let sfxLoaded = false;
        const sfxLoadPromises = [];

        // SFX manifest — maps logical names to actual file names
        const SFX_MANIFEST = {
            // Footsteps (one-per-frame variant picker)
            'step':  ['step.wav',  'step2.wav',  'step3.wav',  'step4.wav'],
            // Landing / feet thud
            'land':  ['feet thud.wav'],
            // Hurt (random 1 of 4)
            'hurt':  ['hurt.mp3', 'hurt2.mp3', 'hurt3.mp3', 'hurt4.mp3'],
            // Death
            'death': ['dead.mp3'],
// Attack hit sounds mapped by combo stage (0-indexed)
             // jab=smack, cross=bish, jab2=smack, cross2=bash, kick=spash + extra variations
             'attack': ['punch1 - smack.wav', 'punch3 - bish.wav',
                        'punch5 - smack.wav', 'punch4 - bash.wav',
                        'punch2 - spash.wav', 'punch6 - doosh.wav',
                        'punch7 - smack.wav', 'punch8 - thud.wav']
        };

        // Lazy AudioContext init — requires a user gesture (first keypress unlocks it)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Preload all SFX files into AudioBuffers
        function preloadSfx() {
            if (sfxLoaded) return;
            // Resolve AudioContext — either already created or create+resume now
            initAudio();
            const ctx = audioCtx;
            const basePath = 'assets/sfx/';
            const allFiles = Object.values(SFX_MANIFEST).flat();
            const uniqueFiles = [...new Set(allFiles)];  // dedupe

            for (const file of uniqueFiles) {
                sfxLoadPromises.push(
                    // encodeURIComponent the filename so spaces / special chars don't 404
                    fetch(basePath + encodeURIComponent(file))
                        .then(r => {
                            if (!r.ok) throw new Error(`HTTP ${r.status} for ${file}`);
                            return r.arrayBuffer();
                        })
                        .then(buf => ctx.decodeAudioData(buf))
                        .then(decoded => { sfxBuffers[file] = decoded; })
                        .catch(err => console.warn('SFX load failed:', file, err.message))
                );
            }
            return Promise.all(sfxLoadPromises).then(() => {
                sfxLoaded = true;
                audioManager = new Audio3DManager(audioCtx);
            });
        }

        // Kick off SFX preload as soon as game data arrives (no user gesture needed for fetch/decode,
        // AudioContext will be lazily resumed on the first keypress)
        const origCheckLoadingComplete = checkLoadingComplete;
        checkLoadingComplete = function () {
            origCheckLoadingComplete();
            if (gameDataReceived && !sfxLoaded) {
                preloadSfx();
            }
        };

// ---- 3D spatial audio manager ----
         // Master gain scales all SFX so they never overwhelm game audio
         // Individual gains encode distance rolloff: 0 dB @ 0 px → -∞ dB @ 2500 px (inverse-square)
         class Audio3DManager {
             constructor(ctx) {
                 this.ctx = ctx;
                 this.masterGain = ctx.createGain();
                 this.masterGain.gain.value = 0.55; // Overall SFX level
                 this.masterGain.connect(ctx.destination);

                 this.LISTENER_X = 0;
                 this.LISTENER_Y = 0;

                 // Camera bounds for screen visibility (updated each frame)
                 this.cameraX = 0;
                 this.cameraY = 0;
                 this.cameraWidth = 800;
                 this.cameraHeight = 600;
                 this.CAMERA_ZOOM = 1.3;

                 // Rolloff parameters (inverse-distance law)
                 this.ROLLOFF_REF_DIST  = 200;  // px: no attenuation within this radius
                 this.ROLLOFF_MAX_DIST  = 2500; // px: full attenuation at this radius
                 this.MAX_GAIN          = 1.0;
                 this.MIN_GAIN          = 0.001; // ~-60 dB floor (prevents total silence edge-cases)

                 // Audio type multipliers
                 this.hurtVolumeMultiplier = 0.3; // Hurt sounds are always quieter
                 this.attackVolumeMultiplier = 1.5; // Attack sounds are louder
             }

             /** Check if position is on screen */
             isOnScreen(sx, sy) {
                 return sx >= this.cameraX && sx <= this.cameraX + this.cameraWidth &&
                        sy >= this.cameraY && sy <= this.cameraY + this.cameraHeight;
             }

             /** Update camera bounds for screen visibility checks */
             updateCamera(cameraX, cameraY, cameraWidth, cameraHeight) {
                 this.cameraX = cameraX;
                 this.cameraY = cameraY;
                 this.cameraWidth = cameraWidth;
                 this.cameraHeight = cameraHeight;
             }

/** Panner gain for a sound at world position (sx, sy) → 3D rolloff */
              calcGain(sx, sy, isHurt = false, isAttack = false) {
                  const dx   = sx - this.LISTENER_X;
                  const dy   = sy - this.LISTENER_Y;
                  const dist = Math.sqrt(dx * dx + dy * dy);

                  // Base distance rolloff
                  let gain;
                  if (dist <= this.ROLLOFF_REF_DIST) {
                      gain = this.MAX_GAIN;
                  } else {
                      const t = Math.min(1, (dist - this.ROLLOFF_REF_DIST) / (this.ROLLOFF_MAX_DIST - this.ROLLOFF_REF_DIST));
                      gain = this.MAX_GAIN * Math.pow(1 - t, 2) + this.MIN_GAIN * (1 - Math.pow(1 - t, 2));
                  }

                  // Apply hurt volume cap
                  if (isHurt) {
                      gain *= this.hurtVolumeMultiplier;
                  }

                  // Boost attack sounds
                  if (isAttack) {
                      gain *= this.attackVolumeMultiplier;
                  }

                  // Apply screen visibility factor
                  const onScreen = this.isOnScreen(sx, sy);
                  if (!onScreen) {
                      // Off-screen sounds are quieter
                      gain *= 0.15;
                  }

                  return gain;
              }

             /** Update listener (local player) world position */
             updateListener(x, y) {
                 this.LISTENER_X = x;
                 this.LISTENER_Y = y;
             }

/**
               * Play a decoded buffer at world position with 3D distance rolloff.
               * @param {AudioBuffer} buffer   Pre-decoded SFX buffer
               * @param {number}     sx        World X of the sound source
               * @param {number}     sy        World Y of the sound source
               * @param {number}     [startOffset=0]  Optional: start part-way into the buffer
               * @param {boolean}     [isHurt=false]  Optional: if true, applies hurt volume cap
               * @param {boolean}     [isAttack=false]  Optional: if true, boosts attack volume
               */
              play(buffer, sx, sy, startOffset = 0, isHurt = false, isAttack = false) {
                  const ctx = this.ctx;
                  const source = ctx.createBufferSource();
                  source.buffer = buffer;

                  const gain = ctx.createGain();
                  gain.gain.value = this.calcGain(sx, sy, isHurt, isAttack);
                  source.connect(gain);
                  gain.connect(this.masterGain);

                  source.start(0, startOffset);
              }
          }

        // ---- Footstep rotation helpers ----
        const STEP_FILES = ['step.wav', 'step2.wav', 'step3.wav', 'step4.wav'];
        let footstepIndex  = 0;
        let stepTriggerCounter = 0;   // counts run-frames since last sound
        let stepInterval = 2;         // fire footstep every 2nd run frame

        // ---- Landing sound on onGround transition (client-side) ----
        const _prevOnGround = new Map(); // playerId → previous onGround state

        // ---- State-listener for audio events broadcast from the server ----
        const consumedAudioEvents = new Set(); // deduplicate per unique event index

        // Capture the original ws.onmessage to extend it
        // (we already intercepted it above; we just need to add the audio-events handler there)
        // Patch: extend the 'state' branch at lines 543-621 of the original onmessage

        // We inject extra logic into the render loop below, after interpolation:

        // ---- Helper: play footsteps when running ----
        function tryFootstep(player) {
            initAudio();
            if (!sfxLoaded || !audioCtx) return;
            const file = STEP_FILES[footstepIndex % STEP_FILES.length];
            if (!sfxBuffers[file]) return;
            footstepIndex++;
            audioManager.play(sfxBuffers[file],
                player.x + PLAYER_WIDTH / 2,
                player.y + PLAYER_HEIGHT);
        }

        function tryFootstepWithInterval(anim, x, y) {
            if (!audioManager || !sfxLoaded) return;
            stepTriggerCounter++;
            if (stepTriggerCounter >= stepInterval) {
                stepTriggerCounter = 0;
                audioManager.play(sfxBuffers[STEP_FILES[footstepIndex % STEP_FILES.length]],
                    x + PLAYER_WIDTH / 2, y + PLAYER_HEIGHT);
                footstepIndex++;
            }
        }

        // ---- Helper: play landing sound ----
        function tryLanding(player) {
            initAudio();
            if (!sfxLoaded || !audioCtx) return;
            const buf = sfxBuffers['feet thud.wav'];
            if (!buf) return;
            audioManager.play(buf, player.x + PLAYER_WIDTH / 2, player.y + PLAYER_HEIGHT);
        }

// ---- Helper: play a named clip at world position ----
         function playClipAt(clip, sx, sy, isHurt = false, isAttack = false) {
             initAudio();
             if (!audioManager || !sfxLoaded || !audioCtx) return;
             const buf = sfxBuffers[clip];
             if (!buf) return;
             audioManager.play(buf, sx, sy, 0, isHurt, isAttack);
         }

        render();

        // ============================================================
        // SPECTATOR MODE — helper functions, event binding, render hooks
        // ============================================================+

        function toggleSpectator() {
            spectatorActive = !spectatorActive;

            if (spectatorActive) {
                // Lock camera at current local-player position
                for (const [id, states] of playerStates) {
                    const s = getInterpolatedPlayerState(id);
                    if (id === myPlayerId && s) {
                        spectatorCamera.x = s.x + PLAYER_WIDTH / 2;
                        spectatorCamera.y = s.y + PLAYER_HEIGHT / 2;
                        break;
                    }
                }
                spectatorCameraZoom = SPECTATOR_CAMERA_ZOOM;
                spectatorTargetId = null;

                 // Zero out all local movement inputs so the server never sees them
                 inputs.left = inputs.right = inputs.jump = inputs.attack = inputs.down = false;
                 if (ws && ws.readyState === WebSocket.OPEN) {
                     ws.send(JSON.stringify({
                         type: 'input',
