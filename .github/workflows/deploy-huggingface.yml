name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Hugging Face Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.huggingface.co
          username: ${{ secrets.HF_USERNAME }}
          password: ${{ secrets.HF_TOKEN }}

      - name: Build and push Docker image
        env:
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          docker build -t registry.huggingface.co/$HF_SPACE_ID .
          docker push registry.huggingface.co/$HF_SPACE_ID
