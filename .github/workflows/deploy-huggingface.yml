name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug variables
        run: |
          echo "HF_SPACE_ID=${HF_SPACE_ID}"
          echo "HF_TOKEN length=${#HF_TOKEN}"

      - name: Login to Hugging Face
        run: |
          echo $HF_TOKEN | docker login registry.huggingface.co --username token --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t registry.huggingface.co/${HF_SPACE_ID}:latest .
          docker push registry.huggingface.co/${HF_SPACE_ID}:latest
