name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugging Face Hub
        run: |
          pip install huggingface_hub

      - name: Deploy to Hugging Face Space via API
        run: |
          python -c "
import os
from huggingface_hub import HfApi

# Get credentials
hf_token = os.environ.get('HF_TOKEN')
space_id = os.environ.get('HF_SPACE_ID')

if not hf_token or not space_id:
    print('Missing HF_TOKEN or HF_SPACE_ID')
    exit(1)

api = HfApi(token=hf_token)

# Upload files via API (handles binary files like PNGs correctly)
api.upload_folder(
    repo_id=space_id,
    repo_type='space',
    folder_path='.',
    ignore_patterns=[
        '.git/**',
        '.github/**',
        'node_modules/**',
        'huggingface-space/**',
        '.gitignore',
        'DEPLOYMENT_TROUBLESHOOTING.md',
        'README.md',
    ],
    path_in_repo='.',
)

print(f'Successfully deployed to https://huggingface.co/spaces/{space_id}')
"
