name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Enable LFS to properly fetch large PNG files

      - name: Install Hugging Face Hub
        run: |
          pip install huggingface_hub

      - name: Clone Hugging Face Space
        run: |
          git lfs install
          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID} huggingface-space
          cd huggingface-space
          git lfs install

      - name: Sync files to Hugging Face Space
        run: |
          # Sync all files EXCEPT the cloned space directory and hidden/git dirs
          rsync -av --delete \
            --exclude='huggingface-space' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.gitignore' \
            --exclude='DEPLOYMENT_TROUBLESHOOTING.md' \
            ./ huggingface-space/
          
          # Show file sizes for audit
          echo "=== Asset file sizes ==="
          find huggingface-space/assets -name "*.png" -exec ls -lh {} \;
          echo "=== Total repo size ==="
          du -sh huggingface-space/

      - name: Commit and Push to Hugging Face Space
        run: |
          cd huggingface-space
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # Track PNGs with LFS (will handle existing files correctly)
          git lfs track "*.png"
          git add .gitattributes
          
          # Add all changes
          git add -A
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy from GitHub Actions - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID} main 2>&1
            echo "Successfully deployed to https://huggingface.co/spaces/${HF_SPACE_ID}"
          fi