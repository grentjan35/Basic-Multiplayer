<!-- Logo Intro Overlay -->
<div id="logo-intro-overlay">
    <div id="logo-intro-content">
        <img id="logo-gif" src="assets/mime.gif" alt="Mime Games Logo">
        <img id="logo-text" src="assets/mimegames.jpeg" alt="mimegames">
        <div id="liquid-loading-bar">
            <div id="liquid-fill"></div>
        </div>
    </div>
</div>

<style>
    #logo-intro-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 1s ease-in-out;
    }

    #logo-intro-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
    }

    #logo-intro-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
    }

    #logo-intro-overlay.show-content #logo-intro-content {
        opacity: 1;
    }

    #logo-gif {
        max-width: 300px;
        max-height: 300px;
        object-fit: contain;
        margin-bottom: 40px;
    }

    #logo-text {
        max-width: 600px;
        max-height: 150px;
        object-fit: contain;
        margin-bottom: 30px;
    }

    #liquid-loading-bar {
        width: 400px;
        height: 20px;
        background: rgba(10, 0, 0, 0.9);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.9),
                    0 0 30px rgba(80, 0, 0, 0.5),
                    0 0 60px rgba(40, 0, 0, 0.3);
        border: 2px solid rgba(60, 0, 0, 0.6);
    }

    #liquid-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg,
            #1a0000,
            #3d0000,
            #660000,
            #990000,
            #cc0000,
            #990000,
            #660000,
            #3d0000,
            #1a0000);
        background-size: 300% 100%;
        border-radius: 8px;
        animation: liquidFlow 2s ease-in-out forwards,
                   liquidPulse 0.4s ease-in-out infinite,
                   liquidWave 1s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(150, 0, 0, 0.8),
                    0 0 40px rgba(100, 0, 0, 0.6),
                    inset 0 0 20px rgba(255, 50, 50, 0.3);
        position: relative;
    }

    #liquid-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(ellipse at center,
            rgba(255, 100, 100, 0.4) 0%,
            transparent 70%);
        animation: bubble 0.8s ease-in-out infinite;
    }

    @keyframes liquidFlow {
        0% {
            width: 0%;
            background-position: 0% 50%;
        }
        100% {
            width: 100%;
            background-position: 100% 50%;
        }
    }

    @keyframes liquidPulse {
        0%, 100% {
            filter: brightness(1) blur(0px);
            transform: scaleY(1) scaleX(1);
        }
        50% {
            filter: brightness(1.3) blur(2px);
            transform: scaleY(1.15) scaleX(1.02);
        }
    }

    @keyframes liquidWave {
        0%, 100% {
            border-radius: 8px;
        }
        25% {
            border-radius: 8px 12px 8px 12px;
        }
        50% {
            border-radius: 12px 8px 12px 8px;
        }
        75% {
            border-radius: 8px 12px 8px 12px;
        }
    }

    @keyframes bubble {
        0%, 100% {
            opacity: 0.3;
            transform: translateY(0);
        }
        50% {
            opacity: 0.6;
            transform: translateY(-3px);
        }
    }

    #liquid-loading-bar::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(90deg,
            transparent,
            rgba(255, 100, 100, 0.15),
            rgba(255, 150, 150, 0.2),
            rgba(255, 100, 100, 0.15),
            transparent);
        background-size: 200% 100%;
        animation: shimmer 1s linear infinite;
        filter: blur(2px);
    }

    @keyframes shimmer {
        0% {
            transform: translateX(-100%);
        }
        100% {
            transform: translateX(100%);
        }
    }
</style>

<script>
    (function() {
        const overlay = document.getElementById('logo-intro-overlay');
        const liquidFill = document.getElementById('liquid-fill');
        
        // Start the intro sequence
        function startIntroSequence() {
            // Fade in the content
            setTimeout(() => {
                overlay.classList.add('show-content');
            }, 100);

            // Start liquid loading bar animation
            setTimeout(() => {
                liquidFill.style.animation = 'liquidFlow 2s ease-in-out forwards, liquidPulse 0.5s ease-in-out infinite';
            }, 500);

            // After 3 seconds of showing the logo, start fade out
            setTimeout(() => {
                overlay.classList.add('fade-out');
                
                // Remove from DOM after fade completes
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1000);
            }, 3000);
        }

        // Start sequence when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startIntroSequence);
        } else {
            startIntroSequence();
        }
    })();
</script>
